<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторийн ажил</title>
</head>
<body>

    <!-- 1. header - Семантик бүтэц -->
    <header>
        <h1>Хэрэглэгчийн бүртгэлийн хуудас</h1>
    </header>

    <!-- 1. main - Семантик бүтэц -->
    <main>
        <!-- 2. Нэр, имэйл, нууц үг, төрсөн огноо, хүйс, сонирхол зэргийг агуулсан форм -->
        <form action="#" method="POST">
            
            <!-- 3 & 4. 1-р input төрөл: text (for/id холболттой) -->
            <div>
                <label for="username">Бүрэн нэр:</label><br>
                <input type="text" id="username" name="username" required minlength="3">
            </div><br>

            <!-- 3 & 4. 2-р input төрөл: email -->
            <div>
                <label for="useremail">Имэйл хаяг:</label><br>
                <input type="email" id="useremail" name="useremail" required>
            </div><br>

            <!-- 3 & 4. 3-р input төрөл: password (pattern атрибуттай) -->
            <div>
                <label for="userpassword">Нууц үг (Багадаа 8 тэмдэгт, тоо болон жижиг үсэг):</label><br>
                <input type="password" id="userpassword" name="userpassword" required pattern="(?=.*\d)(?=.*[a-z]).{8,}">
            </div><br>

            <!-- 3 & 4. 4-р input төрөл: date -->
            <div>
                <label for="birthdate">Төрсөн огноо:</label><br>
                <input type="date" id="birthdate" name="birthdate" required>
            </div><br>

            <!-- 3 & 4. 5-р input төрөл: radio (Хүйс) -->
            <div>
                <label>Хүйс:</label><br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Эрэгтэй</label>
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Эмэгтэй</label>
            </div><br>

            <!-- 3 & 4. 6-р input төрөл: checkbox (Сонирхол) -->
            <div>
                <label>Сонирхол:</label><br>
                <input type="checkbox" id="coding" name="hobby" value="coding">
                <label for="coding">Код бичих</label><br>
                
                <input type="checkbox" id="sports" name="hobby" value="sports">
                <label for="sports">Спорт</label><br>
                
                <input type="checkbox" id="music" name="hobby" value="music">
                <label for="music">Хөгжим сонсох</label>
            </div><br>

            <!-- 3 & 4. Сонгох хэсэг: select -->
            <div>
                <label for="city">Оршин суугаа хот/аймаг:</label><br>
                <select id="city" name="city" required>
                    <option value="">-- Сонгох --</option>
                    <option value="ub">Улаанбаатар</option>
                    <option value="darkhan">Дархан</option>
                    <option value="erdenet">Эрдэнэт</option>
                </select>
            </div><br>

            <button type="submit">Бүртгүүлэх</button>
        </form>
    </main>

    <!-- 1. footer - Семантик бүтэц -->
    <footer>
        <p>&copy; 2026 он. Вэб хөгжүүлэлтийн лаборатори.</p>
    </footer>

</body>
</html><!-- 1-р бүлэг: Хувийн мэдээлэл -->
 <fieldset>
 <legend>Хувийн мэдээлэл</legend>
 <label for="fullname">Овог нэр:</label><br>
 <input type="text" id="fullname" name="fullname" placeholder="И. Болдбаатар" required
minlength="2"><br><br>
 <label for="email">Цахим хаяг (Email):</label><br>
 <input type="email" id="email" name="email" placeholder="example@domain.com"
required><br><br>
 <label for="password">Нууц үг:</label><br>
 <input type="password" id="password" name="password" required minlength="6"><br><br>
 <label for="phone">Утасны дугаар:</label><br>
 <input type="tel" id="phone" name="phone" pattern="[0-9]{8}" placeholder="88112233
